summary:
  key_points:
    - 'Skimming: reading quickly to get the general idea (the gist). Look at the title, the first and last paragraphs and the first sentence of each paragraph.'
    - 'Scanning: looking quickly for one specific detail, such as a name, number or date, without reading every word.'
    - 'The main idea is what the whole text or paragraph is mostly about. Supporting details are the facts, examples and reasons that explain it.'
    - 'An inference is a conclusion you reach from clues in the text when the writer does not say it directly. A good inference must be supported by the text.'
    - 'Reference words (it, they, this, which, such) point back to something already mentioned. Find exactly what they refer to.'
    - 'The writer''s purpose may be to inform, to persuade, to entertain or to instruct. Tone is the writer''s attitude (for example hopeful, critical, neutral).'
    - 'Answer exam questions from the passage, not from your own opinion. Check each option against the text and reject those that are not supported, even if they sound true.'
  formulas: []

solved_exercises:
  - uid: g12-english-3-1-se01
    problem: 'You need to find the year a dam was finished in a two-page article. Should you skim or scan? Explain.'
    steps:
      - 'You are looking for one specific detail (a year).'
      - 'Scan: move your eyes quickly over the text looking for numbers.'
    answer: 'Scan'
  - uid: g12-english-3-1-se02
    problem: '"The well was dry, so the women walked to the next village. It took them four hours." What does "It" refer to?'
    steps:
      - 'Look back for something that "took four hours".'
      - '"It" refers to the walk to the next village.'
    answer: 'The walk to the next village'
  - uid: g12-english-3-1-se03
    problem: '"Abdi looked at the empty plate, then at the clock, and sighed." What can you infer?'
    steps:
      - 'The text does not state his feelings, but an empty plate and a sigh are clues.'
      - 'A reasonable inference: he is still hungry, or tired of waiting.'
    answer: 'He is probably still hungry or impatient.'

