summary:
  key_points:
    - 'A buffer resists changes in pH when small amounts of acid or base are added. It contains a weak acid and its conjugate base (e.g. $\text{CH}_3\text{COOH}$ / $\text{CH}_3\text{COONa}$) or a weak base and its conjugate acid (e.g. $\text{NH}_3$ / $\text{NH}_4\text{Cl}$).'
    - 'In an acidic buffer, added $\text{H}^+$ is removed by $\text{A}^-$ and added $\text{OH}^-$ is removed by HA.'
    - 'Henderson–Hasselbalch equation: $\text{pH} = \text{p}K_a + \log\frac{[\text{A}^-]}{[\text{HA}]}$. When $[\text{A}^-] = [\text{HA}]$, pH = $\text{p}K_a$. Human blood is buffered at about pH 7.4 mainly by $\text{H}_2\text{CO}_3$ / $\text{HCO}_3^-$.'
    - 'Salt hydrolysis: a salt of a strong acid and strong base (NaCl) gives a neutral solution; strong acid + weak base ($\text{NH}_4\text{Cl}$) gives an acidic solution; weak acid + strong base ($\text{CH}_3\text{COONa}$, $\text{Na}_2\text{CO}_3$) gives a basic solution.'
    - 'An acid–base indicator is a weak acid whose acid and base forms have different colours. Phenolphthalein: colourless in acid, pink in base (changes about pH 8.2–10). Methyl orange: red in acid, yellow in base (about pH 3.1–4.4).'
    - 'In a titration, the equivalence point is where the moles of acid and base match the equation. For strong acid–strong base the pH there is 7; for weak acid–strong base it is above 7 (use phenolphthalein); for strong acid–weak base it is below 7 (use methyl orange).'
    - 'For a 1 : 1 reaction, $M_a V_a = M_b V_b$ at the equivalence point. At half-way to equivalence in a weak acid titration, pH = $\text{p}K_a$.'
  formulas:
    - label: Henderson–Hasselbalch
      latex: '\text{pH} = \text{p}K_a + \log\frac{[\text{A}^-]}{[\text{HA}]}'
    - label: 'Titration (1 : 1)'
      latex: 'M_a V_a = M_b V_b'
    - label: Moles from volume
      latex: 'n = M \times V\ (\text{in L})'

solved_exercises:
  - uid: g12-chemistry-1-3-se01
    problem: '20.0 mL of 0.10 M HCl exactly neutralises 25.0 mL of NaOH. Find the concentration of the NaOH.'
    steps:
      - 'Moles HCl $= 0.10 \times 0.020 = 0.0020$ mol. The ratio is 1 : 1, so moles NaOH = 0.0020 mol.'
      - '$M = \frac{0.0020}{0.025} = 0.080$ M.'
    answer: '0.080 M'
  - uid: g12-chemistry-1-3-se02
    problem: 'A buffer contains 0.2 M ethanoic acid ($\text{p}K_a = 4.7$) and 0.2 M sodium ethanoate. Find its pH. What is the pH if the salt is 2.0 M instead?'
    steps:
      - 'Equal concentrations: $\log 1 = 0$, so pH = 4.7.'
      - 'With 2.0 M salt: ratio $= \frac{2.0}{0.2} = 10$, $\log 10 = 1$, so pH = 5.7.'
    answer: '4.7; 5.7'
  - uid: g12-chemistry-1-3-se03
    problem: 'Predict whether a solution of ammonium chloride is acidic, basic or neutral, and explain.'
    steps:
      - '$\text{NH}_4\text{Cl}$ comes from a strong acid (HCl) and a weak base ($\text{NH}_3$).'
      - '$\text{NH}_4^+ + \text{H}_2\text{O} \rightleftharpoons \text{NH}_3 + \text{H}_3\text{O}^+$ produces $\text{H}_3\text{O}^+$; $\text{Cl}^-$ does not react with water.'
    answer: 'Acidic'

flashcards:
  - {uid: g12-chemistry-1-3-fc01, term: Buffer, definition: 'Solution that resists pH change when a little acid or base is added.'}
  - {uid: g12-chemistry-1-3-fc02, term: Henderson–Hasselbalch equation, definition: '$\text{pH} = \text{p}K_a + \log\frac{[\text{A}^-]}{[\text{HA}]}$.'}
  - {uid: g12-chemistry-1-3-fc03, term: Salt hydrolysis, definition: 'Reaction of salt ions with water that can make a solution acidic or basic.'}
  - {uid: g12-chemistry-1-3-fc04, term: Indicator, definition: 'A weak acid whose two forms have different colours.'}
  - {uid: g12-chemistry-1-3-fc05, term: Phenolphthalein, definition: 'Colourless in acid, pink in base; changes about pH 8.2–10.'}
  - {uid: g12-chemistry-1-3-fc06, term: Methyl orange, definition: 'Red in acid, yellow in base; changes about pH 3.1–4.4.'}
  - {uid: g12-chemistry-1-3-fc07, term: Equivalence point, definition: 'Point in a titration where acid and base have reacted in exact proportions.'}
  - {uid: g12-chemistry-1-3-fc08, term: End point, definition: 'Point where the indicator changes colour.'}
  - {uid: g12-chemistry-1-3-fc09, term: Blood buffer, definition: '$\text{H}_2\text{CO}_3$ / $\text{HCO}_3^-$ keeps blood near pH 7.4.'}

questions:
  - uid: g12-chemistry-1-3-q001
    type: single_choice
    difficulty: 1
    stem: 'Which pair of substances makes a buffer solution?'
    options:
      A: 'HCl and NaCl'
      B: 'NaOH and NaCl'
      C: 'Ethanoic acid and sodium ethanoate'
      D: 'HCl and NaOH'
    answer: C
    explanation: 'A buffer needs a weak acid and its conjugate base. HCl is a strong acid, so HCl/NaCl is not a buffer.'

  - uid: g12-chemistry-1-3-q002
    type: single_choice
    difficulty: 1
    stem: 'What is the main property of a buffer?'
    options:
      A: 'It resists changes in pH when small amounts of acid or base are added.'
      B: 'It always has pH 7.'
      C: 'It neutralises any amount of acid.'
      D: 'It changes colour at the end point.'
    answer: A
    explanation: 'A buffer keeps the pH nearly constant, but only for small additions; it can be used up.'

  - uid: g12-chemistry-1-3-q003
    type: single_choice
    difficulty: 2
    stem: 'A little HCl is added to an ethanoic acid / ethanoate buffer. Which species removes the added $\text{H}^+$?'
    options:
      A: '$\text{CH}_3\text{COOH}$'
      B: '$\text{Na}^+$'
      C: '$\text{Cl}^-$'
      D: '$\text{CH}_3\text{COO}^-$'
    answer: D
    explanation: '$\text{CH}_3\text{COO}^- + \text{H}^+ \rightarrow \text{CH}_3\text{COOH}$, so the pH hardly changes.'

  - uid: g12-chemistry-1-3-q004
    type: numeric
    difficulty: 2
    stem: 'A buffer contains equal concentrations of a weak acid ($\text{p}K_a = 4.7$) and its conjugate base. What is its pH?'
    answer: {value: 4.7, tolerance: 0}
    explanation: '$\text{pH} = \text{p}K_a + \log 1 = 4.7 + 0 = 4.7$.'

  - uid: g12-chemistry-1-3-q005
    type: single_choice
    difficulty: 2
    stem: 'A buffer has $[\text{A}^-] = 10 \times [\text{HA}]$ and $\text{p}K_a = 5.0$. What is its pH?'
    options:
      A: '4.0'
      B: '6.0'
      C: '5.0'
      D: '15.0'
    answer: B
    explanation: '$\text{pH} = 5.0 + \log 10 = 5.0 + 1 = 6.0$.'

  - uid: g12-chemistry-1-3-q006
    type: single_choice
    difficulty: 2
    stem: 'A solution of sodium chloride, NaCl, in water is:'
    options:
      A: 'Neutral'
      B: 'Acidic'
      C: 'Basic'
      D: 'A buffer'
    answer: A
    explanation: 'NaCl comes from a strong acid and a strong base; neither ion reacts with water.'

  - uid: g12-chemistry-1-3-q007
    type: single_choice
    difficulty: 2
    stem: 'A solution of sodium ethanoate, $\text{CH}_3\text{COONa}$, is basic. Why?'
    options:
      A: '$\text{Na}^+$ reacts with water to make $\text{H}^+$.'
      B: 'It contains $\text{OH}^-$ in its formula.'
      C: '$\text{CH}_3\text{COO}^-$ reacts with water to form $\text{CH}_3\text{COOH}$ and $\text{OH}^-$.'
      D: 'Sodium is a metal.'
    answer: C
    explanation: 'The ethanoate ion is the conjugate base of a weak acid, so it takes a proton from water, leaving $\text{OH}^-$.'

  - uid: g12-chemistry-1-3-q008
    type: multiple_answers
    difficulty: 2
    stem: 'Which salts give a basic solution in water? Choose all that apply.'
    options:
      A: 'Sodium carbonate, $\text{Na}_2\text{CO}_3$'
      B: 'Ammonium chloride, $\text{NH}_4\text{Cl}$'
      C: 'Potassium nitrate, $\text{KNO}_3$'
      D: 'Sodium ethanoate, $\text{CH}_3\text{COONa}$'
    answer: [A, D]
    explanation: 'Carbonate and ethanoate are conjugate bases of weak acids. $\text{NH}_4\text{Cl}$ is acidic and $\text{KNO}_3$ is neutral.'

  - uid: g12-chemistry-1-3-q009
    type: true_false
    difficulty: 1
    stem: 'A solution of ammonium chloride in water is acidic.'
    answer: true
    explanation: '$\text{NH}_4^+$, the conjugate acid of the weak base $\text{NH}_3$, gives $\text{H}_3\text{O}^+$ in water.'

  - uid: g12-chemistry-1-3-q010
    type: single_choice
    difficulty: 1
    stem: 'What colour is phenolphthalein in a basic solution?'
    options:
      A: 'Colourless'
      B: 'Red'
      C: 'Yellow'
      D: 'Pink'
    answer: D
    explanation: 'Phenolphthalein is colourless in acid and turns pink above about pH 8.2.'

  - uid: g12-chemistry-1-3-q011
    type: single_choice
    difficulty: 1
    stem: 'What colour is methyl orange in a strongly acidic solution?'
    options:
      A: 'Red'
      B: 'Yellow'
      C: 'Blue'
      D: 'Colourless'
    answer: A
    explanation: 'Methyl orange is red below about pH 3.1 and yellow above about 4.4.'

  - uid: g12-chemistry-1-3-q012
    type: numeric
    difficulty: 2
    stem: '20.0 mL of 0.10 M HCl exactly neutralises 25.0 mL of NaOH solution. What is the concentration of the NaOH, in mol/L?'
    answer: {value: 0.08, tolerance: 0, unit: M}
    explanation: '$M_b = \frac{M_a V_a}{V_b} = \frac{0.10 \times 20.0}{25.0} = 0.080$ M.'

  - uid: g12-chemistry-1-3-q013
    type: single_choice
    difficulty: 2
    stem: 'What is the pH at the equivalence point when a strong acid is titrated with a strong base at 25 °C?'
    options:
      A: 'Below 7'
      B: 'Exactly 7'
      C: 'Above 7'
      D: '0'
    answer: B
    explanation: 'The products are a neutral salt and water, so the solution is neutral.'

  - uid: g12-chemistry-1-3-q014
    type: single_choice
    difficulty: 3
    stem: 'Ethanoic acid is titrated with sodium hydroxide. Which indicator is the best choice?'
    options:
      A: 'Methyl orange, because the equivalence point is below 7'
      B: 'Methyl orange, because it is red'
      C: 'Any indicator works equally well.'
      D: 'Phenolphthalein, because the equivalence point is above 7'
    answer: D
    explanation: 'The ethanoate formed is basic, so the equivalence pH is about 8–9, inside phenolphthalein''s range.'

  - uid: g12-chemistry-1-3-q015
    type: single_choice
    difficulty: 3
    stem: 'Hydrochloric acid is titrated with aqueous ammonia (a weak base). Which indicator should be used?'
    options:
      A: 'Phenolphthalein'
      B: 'No indicator is needed.'
      C: 'Methyl orange'
      D: 'Litmus only'
    answer: C
    explanation: 'The ammonium chloride formed is acidic, so the equivalence pH is below 7, in methyl orange''s range.'

  - uid: g12-chemistry-1-3-q016
    type: single_choice
    difficulty: 2
    stem: 'In the titration of a weak acid with a strong base, what is the pH when exactly half of the acid has been neutralised?'
    options:
      A: 'pH = 7'
      B: 'pH = $\text{p}K_a$'
      C: 'pH = 14'
      D: 'pH = $\text{p}K_b$'
    answer: B
    explanation: 'At half-neutralisation $[\text{A}^-] = [\text{HA}]$, so by Henderson–Hasselbalch pH = $\text{p}K_a$.'

  - uid: g12-chemistry-1-3-q017
    type: single_choice
    difficulty: 1
    stem: 'Which buffer system mainly keeps human blood at about pH 7.4?'
    options:
      A: 'Carbonic acid / hydrogencarbonate ($\text{H}_2\text{CO}_3$ / $\text{HCO}_3^-$)'
      B: 'Hydrochloric acid / chloride'
      C: 'Sodium hydroxide / sodium chloride'
      D: 'Sulfuric acid / sulfate'
    answer: A
    explanation: 'The $\text{H}_2\text{CO}_3$ / $\text{HCO}_3^-$ pair is the main blood buffer.'

  - uid: g12-chemistry-1-3-q018
    type: true_false
    difficulty: 2
    stem: 'A buffer can absorb any amount of added strong acid without its pH changing.'
    answer: false
    explanation: 'Once the conjugate base is used up, the buffer fails and the pH falls quickly. Its buffer capacity is limited.'

  - uid: g12-chemistry-1-3-q019
    type: single_choice
    difficulty: 2
    stem: 'Which of these is a basic buffer?'
    options:
      A: 'HCl and NaCl'
      B: 'Ethanoic acid and sodium ethanoate'
      C: 'NaOH and water'
      D: 'Ammonia and ammonium chloride'
    answer: D
    explanation: 'A weak base with its conjugate acid ($\text{NH}_3$ / $\text{NH}_4^+$) makes a buffer with pH above 7.'

  - uid: g12-chemistry-1-3-q020
    type: single_choice
    difficulty: 2
    stem: 'Why is an acid–base indicator itself usually a weak acid?'
    options:
      A: 'So that its acid form and base form, which have different colours, are in equilibrium'
      B: 'So that it can neutralise the titration'
      C: 'So that it does not dissolve'
      D: 'So that it keeps the pH at 7'
    answer: A
    explanation: '$\text{HIn} \rightleftharpoons \text{H}^+ + \text{In}^-$; the colour seen depends on which form is in excess, which depends on pH.'

  - uid: g12-chemistry-1-3-q021
    type: fill_in
    difficulty: 1
    stem: 'In a titration, the point at which the indicator changes colour is called the ________ point.'
    answer: [end]
    explanation: 'A good indicator makes the end point match the equivalence point closely.'

  - uid: g12-chemistry-1-3-q022
    type: fill_in
    difficulty: 2
    stem: 'The reaction of a salt''s ions with water that makes the solution acidic or basic is called salt ________.'
    answer: [hydrolysis]
    explanation: 'Ions from weak acids or weak bases react with water.'

  - uid: g12-chemistry-1-3-q023
    type: true_false
    difficulty: 2
    stem: 'Increasing the concentrations of both the weak acid and its salt (keeping their ratio the same) increases a buffer''s capacity but not its pH.'
    answer: true
    explanation: 'The pH depends on the ratio, so it is unchanged; more of each component means it can absorb more acid or base.'

  - uid: g12-chemistry-1-3-q024
    type: matching
    difficulty: 2
    stem: 'Match each salt with the type of solution it gives in water.'
    left:
      L1: '$\text{KCl}$'
      L2: '$\text{NH}_4\text{NO}_3$'
      L3: '$\text{Na}_2\text{CO}_3$'
    right:
      R1: 'Basic'
      R2: 'Neutral'
      R3: 'Acidic'
      R4: 'A buffer by itself'
    answer: {L1: R2, L2: R3, L3: R1}
    explanation: 'KCl: strong acid + strong base. $\text{NH}_4\text{NO}_3$: contains $\text{NH}_4^+$ from a weak base. $\text{Na}_2\text{CO}_3$: contains carbonate from a weak acid.'

  - uid: g12-chemistry-1-3-q025
    type: ordering
    difficulty: 2
    stem: 'Put these steps of an acid–base titration in the correct order.'
    items:
      A: 'Add base from the burette until the indicator just changes colour.'
      B: 'Pipette a measured volume of acid into a conical flask.'
      C: 'Record the burette reading and calculate the concentration.'
      D: 'Add two or three drops of indicator to the flask.'
    answer: [B, D, A, C]
    explanation: 'Measure the acid, add indicator, titrate to the end point, then record and calculate.'

  - uid: g12-chemistry-1-3-q026
    type: single_choice
    difficulty: 3
    stem: '10.0 mL of $\text{H}_2\text{SO}_4$ is exactly neutralised by 20.0 mL of 0.10 M NaOH. What is the concentration of the acid?'
    options:
      A: '0.20 M'
      B: '0.05 M'
      C: '0.10 M'
      D: '0.40 M'
    answer: C
    explanation: 'Moles NaOH $= 0.0020$. $\text{H}_2\text{SO}_4 + 2\text{NaOH}$, so moles acid $= 0.0010$. $M = \frac{0.0010}{0.0100} = 0.10$ M.'

  - uid: g12-chemistry-1-3-q027
    type: single_choice
    difficulty: 1
    stem: 'Which piece of apparatus is used to add the titrant drop by drop in a titration?'
    options:
      A: 'Beaker'
      B: 'Burette'
      C: 'Test tube'
      D: 'Funnel'
    answer: B
    explanation: 'A burette delivers accurately measured, variable volumes.'

  - uid: g12-chemistry-1-3-q028
    type: single_choice
    difficulty: 2
    stem: 'A buffer is made with $\text{p}K_a = 4.7$. Its pH is 3.7. What is the ratio $\frac{[\text{A}^-]}{[\text{HA}]}$?'
    options:
      A: '10'
      B: '1'
      C: '0.1'
      D: '100'
    answer: C
    explanation: '$3.7 = 4.7 + \log r$, so $\log r = -1$ and $r = 0.1$.'

  - uid: g12-chemistry-1-3-q029
    type: single_choice
    difficulty: 2
    stem: 'The difference between the equivalence point and the end point of a titration is:'
    options:
      A: 'They are always exactly the same.'
      B: 'The equivalence point is when the indicator changes colour.'
      C: 'The end point only happens in weak acid titrations.'
      D: 'The equivalence point is when reactants match in exact proportions; the end point is when the indicator changes colour.'
    answer: D
    explanation: 'With a well-chosen indicator the two are very close, but they are different ideas.'

  - uid: g12-chemistry-1-3-q030
    type: single_choice
    difficulty: 2
    stem: 'Tigist adds a few drops of phenolphthalein to an unknown solution and it stays colourless. What can she conclude?'
    options:
      A: 'The solution is strongly basic.'
      B: 'The pH is below about 8.2.'
      C: 'The solution is exactly neutral.'
      D: 'The solution has pH 14.'
    answer: B
    explanation: 'Phenolphthalein is colourless below about pH 8.2, so the solution could be acidic, neutral or very slightly basic.'
