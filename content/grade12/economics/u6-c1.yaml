summary:
  key_points:
    - 'Poverty is a lack of the income and resources needed for a minimum standard of living. Absolute poverty means income below a fixed line needed for basic needs; relative poverty means having much less than most people in the same society.'
    - 'The World Bank''s international (extreme) poverty line was updated in June 2025 to \$3.00 per person per day (in 2021 purchasing power parity prices), replacing \$2.15. Countries also set their own national poverty lines.'
    - 'Poverty measures: the headcount ratio (share of people below the poverty line), the poverty gap (how far below the line the poor are, on average) and multidimensional measures that also count health, education and living conditions.'
    - 'Inequality is the uneven distribution of income or wealth. The Lorenz curve plots the cumulative share of income against the cumulative share of people; the further it bows below the line of equality, the greater the inequality.'
    - 'The Gini coefficient runs from 0 (perfect equality: everyone has the same income) to 1 (perfect inequality: one person has all income). It is sometimes shown from 0 to 100.'
    - 'Causes of poverty include low productivity, unemployment, poor education and health, rapid population growth, drought and climate shocks, conflict, and weak access to land, credit and markets.'
    - 'Policies to reduce poverty and inequality: economic growth that creates jobs, investment in education and health, progressive taxes, social protection (for example Ethiopia''s Productive Safety Net Programme, which supports food-insecure rural households in return for work on public projects), access to credit and rural development. Sustainable Development Goal 1 aims to end extreme poverty by 2030.'
  formulas:
    - {label: 'Headcount ratio', latex: 'H = \frac{\text{Number of poor}}{\text{Total population}} \times 100\%'}
    - {label: 'Gini from Lorenz curve', latex: 'G = \frac{A}{A + B}'}

solved_exercises:
  - uid: g12-economics-6-1-se01
    problem: 'A village has 2,000 people. 500 of them live below the poverty line. What is the headcount ratio?'
    steps:
      - 'H = 500 / 2,000 × 100%.'
      - 'H = 25%.'
    answer: '25%'
  - uid: g12-economics-6-1-se02
    problem: 'On a Lorenz curve diagram, the area between the line of equality and the Lorenz curve is A = 0.15, and the area below the Lorenz curve is B = 0.35. Find the Gini coefficient.'
    steps:
      - 'G = A / (A + B) = 0.15 / (0.15 + 0.35).'
      - 'G = 0.15 / 0.50 = 0.3.'
    answer: '0.3'
  - uid: g12-economics-6-1-se03
    problem: 'Explain the difference between absolute and relative poverty.'
    steps:
      - 'Absolute poverty compares income with a fixed line for basic needs, such as \$3.00 a day.'
      - 'Relative poverty compares a person with others in the same society, so it can exist even in rich countries.'
    answer: 'Fixed basic-needs line versus comparison with others'

