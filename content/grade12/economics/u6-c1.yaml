  - {uid: g12-economics-6-1-fc01, term: Absolute poverty, definition: 'Income below a fixed line needed for basic needs.'}
  - {uid: g12-economics-6-1-fc02, term: Relative poverty, definition: 'Having much less than most people in the same society.'}
  - {uid: g12-economics-6-1-fc03, term: International poverty line, definition: '\$3.00 per person per day (2021 PPP), set by the World Bank in June 2025.'}
  - {uid: g12-economics-6-1-fc04, term: Headcount ratio, definition: 'Share of the population below the poverty line.'}
  - {uid: g12-economics-6-1-fc05, term: Poverty gap, definition: 'How far below the poverty line the poor are, on average.'}
  - {uid: g12-economics-6-1-fc06, term: Lorenz curve, definition: 'Graph of cumulative income share against cumulative population share.'}
  - {uid: g12-economics-6-1-fc07, term: Gini coefficient, definition: 'Inequality measure from 0 (equal) to 1 (totally unequal).'}
  - {uid: g12-economics-6-1-fc08, term: PSNP, definition: 'Productive Safety Net Programme: Ethiopian support for food-insecure rural households.'}
