  g12-economics-1-1-q026: {hash: 'e67306e49711e5e3d127c232006f84383f001c281d5dfbc35f84b678e86ea219', answer: C, note: 'Concept wording is debatable: money workers "send home" is remittances. In national accounts, remittances from migrants who live abroad are current transfers (secondary income), not factor income, so they do not raise GNP/GNI. What raises GNP above GDP is factor income EARNED abroad by residents. Suggest: "Ethiopian residents earn more factor income abroad than foreigners earn in Ethiopia." Answer C is the intended key.'}
