summary:
  key_points:
    - 'Word problems: read carefully, write down what is given and what is asked, choose the operation, then check that the answer is sensible (units, size).'
    - 'Age problems: everyone gets older by the same number of years. If A is 5 years older than B now, A will still be 5 years older in 10 years.'
    - 'Profit $=$ selling price $-$ cost price. Profit % $= \frac{\text{profit}}{\text{cost price}} \times 100\%$.'
    - 'Simple interest $I = \frac{P \times R \times T}{100}$, where $P$ is the amount, $R$ the rate per year and $T$ the time in years.'
    - 'Data interpretation: read the title, labels and units first. Find totals, differences, averages and percentages from the data, and answer only what the data shows.'
    - 'Percentage change $= \frac{\text{new} - \text{old}}{\text{old}} \times 100\%$.'
  formulas:
    - label: Profit percentage
      latex: '\text{profit}\,\% = \frac{\text{SP} - \text{CP}}{\text{CP}} \times 100\%'
    - label: Simple interest
      latex: 'I = \frac{PRT}{100}'
    - label: Percentage change
      latex: '\%\ \text{change} = \frac{\text{new} - \text{old}}{\text{old}} \times 100\%'

solved_exercises:
  - uid: g12-aptitude-2-2-se01
    problem: 'A trader buys a goat for 4 000 birr and sells it for 5 000 birr. Find the profit percentage.'
    steps:
      - 'Profit $= 5000 - 4000 = 1000$ birr.'
      - 'Profit % $= \frac{1000}{4000} \times 100\% = 25\%$.'
    answer: '25%'
  - uid: g12-aptitude-2-2-se02
    problem: 'Hodan is 3 times as old as her sister. The sum of their ages is 24. How old is each?'
    steps:
      - 'Let the sister be $x$; Hodan is $3x$; $x + 3x = 24$, so $x = 6$.'
      - 'Sister 6 years, Hodan 18 years.'
    answer: 'Sister 6, Hodan 18'
  - uid: g12-aptitude-2-2-se03
    problem: 'A school had 400 students last year and 500 this year. Find the percentage increase.'
    steps:
      - 'Increase $= 100$.'
      - '$\frac{100}{400} \times 100\% = 25\%$.'
    answer: '25%'

flashcards:
  - {uid: g12-aptitude-2-2-fc01, term: Profit, definition: 'Selling price minus cost price.'}
  - {uid: g12-aptitude-2-2-fc02, term: Profit percentage, definition: 'Profit ÷ cost price × 100%.'}
  - {uid: g12-aptitude-2-2-fc03, term: Simple interest, definition: '$I = \frac{PRT}{100}$.'}
  - {uid: g12-aptitude-2-2-fc04, term: Percentage change, definition: '(new − old) ÷ old × 100%.'}
  - {uid: g12-aptitude-2-2-fc05, term: Age difference, definition: 'Stays the same as years pass.'}
  - {uid: g12-aptitude-2-2-fc06, term: Reading data, definition: 'Check the title, labels and units before calculating.'}

questions:
  - uid: g12-aptitude-2-2-q001
    type: single_choice
    difficulty: 1
    stem: 'A trader buys a sack of maize for 2 000 birr and sells it for 2 500 birr. What is the profit?'
    options:
      A: '250 birr'
      B: '500 birr'
      C: '4 500 birr'
      D: '2 500 birr'
    answer: B
    explanation: 'Profit $= 2500 - 2000 = 500$ birr.'

  - uid: g12-aptitude-2-2-q002
    type: numeric
    difficulty: 2
    stem: 'A goat bought for 4 000 birr is sold for 5 000 birr. What is the profit percentage?'
    answer: {value: 25, tolerance: 0, unit: '%'}
    explanation: '$\frac{1000}{4000} \times 100\% = 25\%$.'

  - uid: g12-aptitude-2-2-q003
    type: single_choice
    difficulty: 2
    stem: 'What simple interest is earned on 10 000 birr at 8% per year for 3 years?'
    options:
      A: '800 birr'
      B: '2 400 birr'
      C: '1 600 birr'
      D: '24 000 birr'
    answer: B
    explanation: '$I = \frac{10000 \times 8 \times 3}{100} = 2400$ birr.'

  - uid: g12-aptitude-2-2-q004
    type: single_choice
    difficulty: 2
    stem: 'Abdi is 12 years older than his son. In 5 years, how much older will Abdi be than his son?'
    options:
      A: '17 years'
      B: '7 years'
      C: '12 years'
      D: '60 years'
    answer: C
    explanation: 'Both get 5 years older, so the difference stays 12 years.'

  - uid: g12-aptitude-2-2-q005
    type: single_choice
    difficulty: 3
    stem: 'A mother is 3 times as old as her daughter. The sum of their ages is 48. How old is the daughter?'
    options:
      A: '12'
      B: '16'
      C: '36'
      D: '24'
    answer: A
    explanation: '$x + 3x = 48$, so $x = 12$.'

  - uid: g12-aptitude-2-2-q006
    type: single_choice
    difficulty: 2
    stem: 'A school had 400 students last year and 500 this year. What is the percentage increase?'
    options:
      A: '20%'
      B: '100%'
      C: '50%'
      D: '25%'
    answer: D
    explanation: '$\frac{100}{400} \times 100\% = 25\%$. (Dividing by the new number, 500, would wrongly give 20%.)'

  - uid: g12-aptitude-2-2-q007
    type: single_choice
    difficulty: 2
    stem: 'A shop sold these numbers of exercise books: Monday 20, Tuesday 35, Wednesday 25, Thursday 40, Friday 30. How many books did it sell in total?'
    options:
      A: '140'
      B: '150'
      C: '160'
      D: '120'
    answer: B
    explanation: '$20 + 35 + 25 + 40 + 30 = 150$.'

  - uid: g12-aptitude-2-2-q008
    type: single_choice
    difficulty: 2
    stem: 'Using the same sales (Mon 20, Tue 35, Wed 25, Thu 40, Fri 30), what was the mean number of books sold per day?'
    options:
      A: '25'
      B: '35'
      C: '30'
      D: '40'
    answer: C
    explanation: '$\frac{150}{5} = 30$.'

  - uid: g12-aptitude-2-2-q009
    type: single_choice
    difficulty: 1
    stem: 'Using the same sales (Mon 20, Tue 35, Wed 25, Thu 40, Fri 30), on which day were the most books sold?'
    options:
      A: 'Tuesday'
      B: 'Friday'
      C: 'Monday'
      D: 'Thursday'
    answer: D
    explanation: 'Thursday had the highest number, 40.'

  - uid: g12-aptitude-2-2-q010
    type: numeric
    difficulty: 2
    stem: 'Using the same sales (Mon 20, Tue 35, Wed 25, Thu 40, Fri 30), what percentage of the week''s total was sold on Monday? (Give a number rounded to one decimal place.)'
    answer: {value: 13.3, tolerance: 0.05, unit: '%'}
    explanation: '$\frac{20}{150} \times 100\% \approx 13.3\%$.'

  - uid: g12-aptitude-2-2-q011
    type: single_choice
    difficulty: 2
    stem: 'In a class of 40 students, 30% walk to school, 50% take a bus and the rest cycle. How many students cycle?'
    options:
      A: '8'
      B: '12'
      C: '20'
      D: '4'
    answer: A
    explanation: '$100\% - 30\% - 50\% = 20\%$; $20\%$ of 40 $= 8$.'

  - uid: g12-aptitude-2-2-q012
    type: single_choice
    difficulty: 2
    stem: 'A recipe for 4 people needs 600 g of flour. How much flour is needed for 10 people?'
    options:
      A: '1 200 g'
      B: '1 000 g'
      C: '2 400 g'
      D: '1 500 g'
    answer: D
    explanation: '150 g per person; $150 \times 10 = 1500$ g.'

  - uid: g12-aptitude-2-2-q013
    type: single_choice
    difficulty: 3
    stem: 'A tank holds 1 200 litres. It is filled at 40 litres per minute while 10 litres per minute leak out. How long does it take to fill the empty tank?'
    options:
      A: '30 minutes'
      B: '24 minutes'
      C: '40 minutes'
      D: '120 minutes'
    answer: C
    explanation: 'Net filling rate $= 30$ L/min; $\frac{1200}{30} = 40$ minutes.'

  - uid: g12-aptitude-2-2-q014
    type: single_choice
    difficulty: 2
    stem: 'A trader sells a radio at a loss of 10%. The radio cost 3 000 birr. What is the selling price?'
    options:
      A: '2 700 birr'
      B: '3 300 birr'
      C: '2 900 birr'
      D: '300 birr'
    answer: A
    explanation: '$3000 \times 0.9 = 2700$ birr.'

  - uid: g12-aptitude-2-2-q015
    type: single_choice
    difficulty: 2
    stem: 'The rainfall in a town was: June 40 mm, July 120 mm, August 100 mm. By how many millimetres did July''s rainfall exceed June''s?'
    options:
      A: '20 mm'
      B: '80 mm'
      C: '160 mm'
      D: '60 mm'
    answer: B
    explanation: '$120 - 40 = 80$ mm.'

  - uid: g12-aptitude-2-2-q016
    type: single_choice
    difficulty: 3
    stem: 'Using the same rainfall data (June 40 mm, July 120 mm, August 100 mm), what was the percentage change from July to August?'
    options:
      A: 'A rise of 20%'
      B: 'A fall of 20%'
      C: 'A fall of about 16.7%'
      D: 'A rise of about 16.7%'
    answer: C
    explanation: '$\frac{100 - 120}{120} \times 100\% \approx -16.7\%$, a fall.'

  - uid: g12-aptitude-2-2-q017
    type: true_false
    difficulty: 2
    stem: 'If prices rise from 50 birr to 75 birr, the percentage increase is 50%.'
    answer: true
    explanation: '$\frac{25}{50} \times 100\% = 50\%$.'

  - uid: g12-aptitude-2-2-q018
    type: true_false
    difficulty: 2
    stem: 'Simple interest on the same amount at the same rate for 4 years is twice the interest for 2 years.'
    answer: true
    explanation: 'Simple interest is proportional to time.'

  - uid: g12-aptitude-2-2-q019
    type: true_false
    difficulty: 1
    stem: 'Profit percentage is calculated by dividing the profit by the selling price.'
    answer: false
    explanation: 'Profit percentage is calculated on the cost price.'

  - uid: g12-aptitude-2-2-q020
    type: multiple_answers
    difficulty: 2
    stem: 'A farm produced 200 quintals of teff in 2023 and 250 quintals in 2024. Which statements are correct? Choose all that apply.'
    options:
      A: 'Production increased by 50 quintals.'
      B: 'The percentage increase was 25%.'
      C: 'Production doubled.'
      D: 'The 2024 production was 125% of the 2023 production.'
    answer: [A, B, D]
    explanation: '$250 - 200 = 50$; $\frac{50}{200} = 25\%$; $\frac{250}{200} = 125\%$. Doubling would be 400 quintals.'

  - uid: g12-aptitude-2-2-q021
    type: fill_in
    difficulty: 1
    stem: 'Three pens cost 60 birr. How many birr do 5 pens cost? Write the number only.'
    answer: ['100']
    explanation: 'One pen costs 20 birr; $5 \times 20 = 100$.'

  - uid: g12-aptitude-2-2-q022
    type: fill_in
    difficulty: 2
    stem: 'A worker saves 15% of a monthly salary of 6 000 birr. How many birr does she save each month? Write the number only.'
    answer: ['900']
    explanation: '$0.15 \times 6000 = 900$.'

  - uid: g12-aptitude-2-2-q023
    type: matching
    difficulty: 2
    stem: 'Match each quantity with its formula.'
    left:
      L1: 'Profit'
      L2: 'Simple interest'
      L3: 'Mean'
    right:
      R1: '$\frac{PRT}{100}$'
      R2: 'Sum ÷ number of items'
      R3: 'Selling price − cost price'
      R4: 'Distance ÷ time'
    answer: {L1: R3, L2: R1, L3: R2}
    explanation: 'Distance ÷ time gives speed.'

  - uid: g12-aptitude-2-2-q024
    type: ordering
    difficulty: 2
    stem: 'Four students scored: Amina 72, Bilal 85, Chaltu 68, Dawit 90. Put them in order from highest score to lowest.'
    items:
      A: 'Amina'
      B: 'Bilal'
      C: 'Chaltu'
      D: 'Dawit'
    answer: [D, B, A, C]
    explanation: '90 > 85 > 72 > 68.'

  - uid: g12-aptitude-2-2-q025
    type: single_choice
    difficulty: 2
    stem: 'Using the same scores (Amina 72, Bilal 85, Chaltu 68, Dawit 90), what is the range of the scores?'
    options:
      A: '18'
      B: '17'
      C: '22'
      D: '158'
    answer: C
    explanation: 'Range $=$ highest $-$ lowest $= 90 - 68 = 22$.'

  - uid: g12-aptitude-2-2-q026
    type: single_choice
    difficulty: 3
    stem: 'A shirt''s price is 800 birr after a 20% discount. What was the original price?'
    options:
      A: '960 birr'
      B: '640 birr'
      C: '1 200 birr'
      D: '1 000 birr'
    answer: D
    explanation: '80% of the original is 800, so the original is $\frac{800}{0.8} = 1000$ birr.'

  - uid: g12-aptitude-2-2-q027
    type: single_choice
    difficulty: 2
    stem: 'A minibus can carry 12 passengers. How many minibuses are needed for 50 passengers?'
    options:
      A: '4'
      B: '5'
      C: '4.2'
      D: '3'
    answer: B
    explanation: '$50 \div 12 \approx 4.2$, so 4 minibuses are not enough; 5 are needed.'

  - uid: g12-aptitude-2-2-q028
    type: single_choice
    difficulty: 2
    stem: 'Out of 60 students surveyed, 15 prefer football, 25 prefer basketball and the rest prefer athletics. What fraction prefer athletics?'
    options:
      A: '$\frac{1}{3}$'
      B: '$\frac{1}{4}$'
      C: '$\frac{5}{12}$'
      D: '$\frac{1}{2}$'
    answer: A
    explanation: '$60 - 15 - 25 = 20$; $\frac{20}{60} = \frac{1}{3}$.'

  - uid: g12-aptitude-2-2-q029
    type: single_choice
    difficulty: 3
    stem: 'Two taps fill a tank. Tap A alone fills it in 6 hours; tap B alone in 3 hours. How long do both together take?'
    options:
      A: '4.5 hours'
      B: '9 hours'
      C: '2 hours'
      D: '3 hours'
    answer: C
    explanation: 'Rates: $\frac{1}{6} + \frac{1}{3} = \frac{1}{2}$ tank per hour, so 2 hours.'

  - uid: g12-aptitude-2-2-q030
    type: single_choice
    difficulty: 2
    stem: 'A runner covers 400 m in 80 seconds. What is her average speed?'
    options:
      A: '5 m/s'
      B: '0.2 m/s'
      C: '50 m/s'
      D: '320 m/s'
    answer: A
    explanation: '$\frac{400}{80} = 5$ m/s.'
