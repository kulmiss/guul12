summary:
  key_points:
    - 'To find the next number in a series, first look at the differences between terms. If the differences are equal, add the same amount each time (arithmetic series).'
    - 'If the differences change, look at the differences of the differences (second differences), or check whether each term is multiplied by the same number (geometric series: 3, 6, 12, 24, ...).'
    - 'Other common patterns: square numbers (1, 4, 9, 16), cube numbers (1, 8, 27, 64), prime numbers (2, 3, 5, 7, 11), Fibonacci-type series where each term is the sum of the two before (1, 1, 2, 3, 5, 8), and two series mixed together in alternate places.'
    - 'Percentages: $x\%$ of $N = \frac{x}{100} \times N$. A rise of 20% multiplies by 1.2; a fall of 20% multiplies by 0.8.'
    - 'Ratios: to share an amount in the ratio $a : b$, divide it into $a + b$ equal parts.'
    - 'Averages: mean $= \frac{\text{sum}}{\text{number of items}}$, so sum $= \text{mean} \times \text{number}$.'
    - 'Speed, distance and time: distance $= \text{speed} \times \text{time}$.'
  formulas:
    - label: Arithmetic series
      latex: 'a_n = a_1 + (n-1)d'
    - label: Geometric series
      latex: 'a_n = a_1 r^{n-1}'
    - label: Percentage
      latex: 'x\%\ \text{of}\ N = \frac{x}{100} \times N'
    - label: Mean
      latex: '\bar{x} = \frac{\sum x}{n}'
    - label: Distance
      latex: 'd = v \times t'

solved_exercises:
  - uid: g12-aptitude-2-1-se01
    problem: 'Find the next number: 2, 5, 10, 17, 26, ?'
    steps:
      - 'Differences: 3, 5, 7, 9 – they increase by 2.'
      - 'Next difference is 11, so the next term is $26 + 11 = 37$.'
    answer: '37'
  - uid: g12-aptitude-2-1-se02
    problem: 'Share 600 birr between Ali and Hawa in the ratio 2 : 3.'
    steps:
      - 'Total parts $= 2 + 3 = 5$; one part $= \frac{600}{5} = 120$ birr.'
      - 'Ali: $2 \times 120 = 240$ birr; Hawa: $3 \times 120 = 360$ birr.'
    answer: 'Ali 240 birr, Hawa 360 birr'
  - uid: g12-aptitude-2-1-se03
    problem: 'The mean mark of 5 students is 70. A sixth student scores 82. What is the new mean?'
    steps:
      - 'Old total $= 5 \times 70 = 350$; new total $= 350 + 82 = 432$.'
      - 'New mean $= \frac{432}{6} = 72$.'
    answer: '72'

flashcards:
  - {uid: g12-aptitude-2-1-fc01, term: Arithmetic series, definition: 'Same number added each time, e.g. 4, 7, 10, 13.'}
  - {uid: g12-aptitude-2-1-fc02, term: Geometric series, definition: 'Multiplied by the same number each time, e.g. 2, 6, 18, 54.'}
  - {uid: g12-aptitude-2-1-fc03, term: Second differences, definition: 'Differences between the differences; constant for square-type series.'}
  - {uid: g12-aptitude-2-1-fc04, term: Fibonacci-type, definition: 'Each term is the sum of the two before.'}
  - {uid: g12-aptitude-2-1-fc05, term: Alternating series, definition: 'Two patterns mixed in odd and even places.'}
  - {uid: g12-aptitude-2-1-fc06, term: Percentage increase, definition: 'Rise of x% multiplies by (1 + x/100).'}
  - {uid: g12-aptitude-2-1-fc07, term: Ratio sharing, definition: 'Divide by the total number of parts first.'}

questions:
  - uid: g12-aptitude-2-1-q001
    type: single_choice
    difficulty: 1
    stem: 'Find the next number: 4, 9, 14, 19, ?'
    options:
      A: '23'
      B: '24'
      C: '25'
      D: '29'
    answer: B
    explanation: 'Add 5 each time: $19 + 5 = 24$.'

  - uid: g12-aptitude-2-1-q002
    type: single_choice
    difficulty: 1
    stem: 'Find the next number: 3, 6, 12, 24, ?'
    options:
      A: '48'
      B: '36'
      C: '30'
      D: '27'
    answer: A
    explanation: 'Each term is doubled: $24 \times 2 = 48$.'

  - uid: g12-aptitude-2-1-q003
    type: single_choice
    difficulty: 2
    stem: 'Find the next number: 1, 4, 9, 16, 25, ?'
    options:
      A: '30'
      B: '34'
      C: '36'
      D: '49'
    answer: C
    explanation: 'These are square numbers: $1^2, 2^2, ..., 6^2 = 36$.'

  - uid: g12-aptitude-2-1-q004
    type: single_choice
    difficulty: 2
    stem: 'Find the next number: 1, 1, 2, 3, 5, 8, ?'
    options:
      A: '11'
      B: '12'
      C: '16'
      D: '13'
    answer: D
    explanation: 'Each term is the sum of the two before: $5 + 8 = 13$.'

  - uid: g12-aptitude-2-1-q005
    type: numeric
    difficulty: 2
    stem: 'Find the next number: 2, 5, 10, 17, 26, ?'
    answer: {value: 37, tolerance: 0}
    explanation: 'Differences 3, 5, 7, 9, so the next difference is 11: $26 + 11 = 37$.'

  - uid: g12-aptitude-2-1-q006
    type: single_choice
    difficulty: 2
    stem: 'Find the next number: 81, 27, 9, 3, ?'
    options:
      A: '0'
      B: '1'
      C: '2'
      D: '−3'
    answer: B
    explanation: 'Divide by 3 each time: $3 \div 3 = 1$.'

  - uid: g12-aptitude-2-1-q007
    type: single_choice
    difficulty: 3
    stem: 'Find the next number: 2, 3, 5, 7, 11, 13, ?'
    options:
      A: '15'
      B: '16'
      C: '17'
      D: '19'
    answer: C
    explanation: 'These are the prime numbers; the next prime after 13 is 17.'

  - uid: g12-aptitude-2-1-q008
    type: single_choice
    difficulty: 3
    stem: 'Find the next number: 1, 10, 3, 20, 5, 30, ?'
    options:
      A: '7'
      B: '40'
      C: '35'
      D: '6'
    answer: A
    explanation: 'Two series alternate: 1, 3, 5, 7 (odd places) and 10, 20, 30 (even places). The next term is in an odd place: 7.'

  - uid: g12-aptitude-2-1-q009
    type: single_choice
    difficulty: 2
    stem: 'Find the missing number: 5, 11, ?, 23, 29'
    options:
      A: '15'
      B: '16'
      C: '18'
      D: '17'
    answer: D
    explanation: 'Add 6 each time: $11 + 6 = 17$, and $17 + 6 = 23$ checks.'

  - uid: g12-aptitude-2-1-q010
    type: numeric
    difficulty: 2
    stem: 'Find the next number: 1, 8, 27, 64, ?'
    answer: {value: 125, tolerance: 0}
    explanation: 'These are cube numbers: $5^3 = 125$.'

  - uid: g12-aptitude-2-1-q011
    type: single_choice
    difficulty: 1
    stem: 'What is 15% of 400?'
    options:
      A: '40'
      B: '60'
      C: '15'
      D: '75'
    answer: B
    explanation: '$\frac{15}{100} \times 400 = 60$.'

  - uid: g12-aptitude-2-1-q012
    type: single_choice
    difficulty: 2
    stem: 'A shirt costs 500 birr. Its price rises by 20%. What is the new price?'
    options:
      A: '520 birr'
      B: '550 birr'
      C: '600 birr'
      D: '700 birr'
    answer: C
    explanation: '$500 \times 1.2 = 600$ birr.'

  - uid: g12-aptitude-2-1-q013
    type: single_choice
    difficulty: 2
    stem: 'A phone costs 8 000 birr. In a sale it is 25% cheaper. What is the sale price?'
    options:
      A: '6 000 birr'
      B: '2 000 birr'
      C: '7 750 birr'
      D: '7 000 birr'
    answer: A
    explanation: '25% of 8 000 is 2 000; $8000 - 2000 = 6000$ birr.'

  - uid: g12-aptitude-2-1-q014
    type: numeric
    difficulty: 2
    stem: 'Share 900 birr between Ahmed and Sara in the ratio 4 : 5. How many birr does Sara get?'
    answer: {value: 500, tolerance: 0, unit: birr}
    explanation: '9 parts; one part $= 100$ birr; Sara gets $5 \times 100 = 500$ birr.'

  - uid: g12-aptitude-2-1-q015
    type: single_choice
    difficulty: 2
    stem: 'The mean of four numbers is 12. What is their sum?'
    options:
      A: '3'
      B: '16'
      C: '48'
      D: '24'
    answer: C
    explanation: 'Sum $=$ mean $\times$ number $= 12 \times 4 = 48$.'

  - uid: g12-aptitude-2-1-q016
    type: single_choice
    difficulty: 3
    stem: 'The mean age of 5 children is 10 years. When their teacher joins, the mean age becomes 15 years. How old is the teacher?'
    options:
      A: '25'
      B: '30'
      C: '35'
      D: '40'
    answer: D
    explanation: 'Children total $= 50$; new total $= 6 \times 15 = 90$; teacher $= 90 - 50 = 40$.'

  - uid: g12-aptitude-2-1-q017
    type: single_choice
    difficulty: 2
    stem: 'A bus travels at 60 km/h for 3 hours. How far does it go?'
    options:
      A: '20 km'
      B: '180 km'
      C: '63 km'
      D: '120 km'
    answer: B
    explanation: 'Distance $= 60 \times 3 = 180$ km.'

  - uid: g12-aptitude-2-1-q018
    type: single_choice
    difficulty: 2
    stem: 'A car travels 240 km in 4 hours. What is its average speed?'
    options:
      A: '60 km/h'
      B: '40 km/h'
      C: '80 km/h'
      D: '960 km/h'
    answer: A
    explanation: 'Speed $= \frac{240}{4} = 60$ km/h.'

  - uid: g12-aptitude-2-1-q019
    type: true_false
    difficulty: 1
    stem: 'The series 7, 14, 28, 56 is a geometric series.'
    answer: true
    explanation: 'Each term is multiplied by 2.'

  - uid: g12-aptitude-2-1-q020
    type: true_false
    difficulty: 2
    stem: 'Increasing a price by 10% and then decreasing the new price by 10% brings it back to the original price.'
    answer: false
    explanation: 'For 100 birr: $100 \times 1.1 = 110$, then $110 \times 0.9 = 99$ birr, which is less than the original.'

  - uid: g12-aptitude-2-1-q021
    type: true_false
    difficulty: 2
    stem: 'In the series 100, 95, 85, 70, 50, the next number is 25.'
    answer: true
    explanation: 'The amounts taken away are 5, 10, 15, 20, so next is 25: $50 - 25 = 25$.'

  - uid: g12-aptitude-2-1-q022
    type: multiple_answers
    difficulty: 2
    stem: 'Which of these series are arithmetic (the same number added each time)? Choose all that apply.'
    options:
      A: '3, 7, 11, 15'
      B: '2, 4, 8, 16'
      C: '20, 17, 14, 11'
      D: '1, 4, 9, 16'
    answer: [A, C]
    explanation: 'A adds 4 and C adds −3. B multiplies by 2; D is square numbers.'

  - uid: g12-aptitude-2-1-q023
    type: fill_in
    difficulty: 1
    stem: 'Find the next number: 10, 20, 30, 40, ________'
    answer: ['50']
    explanation: 'Add 10 each time.'

  - uid: g12-aptitude-2-1-q024
    type: fill_in
    difficulty: 2
    stem: 'Find the next number: 2, 6, 18, 54, ________'
    answer: ['162']
    explanation: 'Multiply by 3 each time: $54 \times 3 = 162$.'

  - uid: g12-aptitude-2-1-q025
    type: matching
    difficulty: 2
    stem: 'Match each series with its rule.'
    left:
      L1: '5, 10, 15, 20'
      L2: '1, 3, 9, 27'
      L3: '1, 4, 9, 16'
    right:
      R1: 'Multiply by 3'
      R2: 'Square numbers'
      R3: 'Add 5'
      R4: 'Prime numbers'
    answer: {L1: R3, L2: R1, L3: R2}
    explanation: 'None of the series is the primes (2, 3, 5, 7, ...).'

  - uid: g12-aptitude-2-1-q026
    type: ordering
    difficulty: 2
    stem: 'Put these values in order from smallest to largest.'
    items:
      A: '30% of 200'
      B: 'Half of 100'
      C: '25% of 400'
      D: '10% of 300'
    answer: [D, B, A, C]
    explanation: '10% of 300 = 30; half of 100 = 50; 30% of 200 = 60; 25% of 400 = 100.'

  - uid: g12-aptitude-2-1-q027
    type: single_choice
    difficulty: 2
    stem: 'A worker earns 3 000 birr for 5 days. At the same rate, how much will she earn in 8 days?'
    options:
      A: '4 000 birr'
      B: '4 200 birr'
      C: '5 000 birr'
      D: '4 800 birr'
    answer: D
    explanation: 'She earns 600 birr per day: $600 \times 8 = 4800$ birr.'

  - uid: g12-aptitude-2-1-q028
    type: single_choice
    difficulty: 3
    stem: 'Four workers can build a wall in 6 days. How many days would 8 workers take, working at the same rate?'
    options:
      A: '12'
      B: '3'
      C: '2'
      D: '4'
    answer: B
    explanation: 'The job needs $4 \times 6 = 24$ worker-days; with 8 workers, $\frac{24}{8} = 3$ days.'

  - uid: g12-aptitude-2-1-q029
    type: single_choice
    difficulty: 2
    stem: 'Find the next number: 64, 32, 16, 8, ?'
    options:
      A: '0'
      B: '2'
      C: '4'
      D: '6'
    answer: C
    explanation: 'Halve each time: $8 \div 2 = 4$.'

  - uid: g12-aptitude-2-1-q030
    type: single_choice
    difficulty: 3
    stem: 'A class has 24 girls and 16 boys. What percentage of the class are boys?'
    options:
      A: '40%'
      B: '16%'
      C: '60%'
      D: '66%'
    answer: A
    explanation: 'Total $= 40$; $\frac{16}{40} \times 100\% = 40\%$.'
