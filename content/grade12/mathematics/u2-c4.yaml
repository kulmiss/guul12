summary:
  key_points:
    - 'Integration is the reverse of differentiation. $F$ is an antiderivative of $f$ if $F''(x) = f(x)$.'
    - 'The indefinite integral $\int f(x)\,dx = F(x) + C$ includes every antiderivative; $C$ is the constant of integration.'
    - 'Power rule for integrals: $\int x^n\,dx = \frac{x^{n+1}}{n+1} + C$ for $n \neq -1$.'
    - 'Constants come out and sums split: $\int (af + bg)\,dx = a\int f\,dx + b\int g\,dx$. There is no simple product rule for integrals.'
    - 'Fundamental theorem of calculus: if $F'' = f$ then $\int_a^b f(x)\,dx = F(b) - F(a)$.'
    - 'If $f(x) \ge 0$ on $[a, b]$, $\int_a^b f(x)\,dx$ is the area between the curve and the $x$-axis. Where $f$ is negative the integral is negative.'
    - 'Area between two curves with $f \ge g$ on $[a, b]$ is $\int_a^b (f - g)\,dx$.'
    - 'Integrating a velocity gives displacement; integrating a marginal cost gives the change in cost.'
  formulas:
    - label: Power rule (n ≠ −1)
      latex: '\int x^n\,dx = \frac{x^{n+1}}{n+1} + C'
    - label: Fundamental theorem of calculus
      latex: '\int_a^b f(x)\,dx = F(b) - F(a)'
    - label: Reversing the limits
      latex: '\int_b^a f(x)\,dx = -\int_a^b f(x)\,dx'
    - label: Joining intervals
      latex: '\int_a^b f\,dx + \int_b^c f\,dx = \int_a^c f\,dx'
    - label: Area between curves (f ≥ g)
      latex: 'A = \int_a^b \left(f(x) - g(x)\right)dx'

solved_exercises:
  - uid: g12-mathematics-2-4-se01
    problem: 'Find $\int (6x^2 - 4x + 3)\,dx$.'
    steps:
      - 'Integrate each term with the power rule.'
      - '$6 \cdot \frac{x^3}{3} - 4 \cdot \frac{x^2}{2} + 3x + C$.'
      - 'Simplify: $2x^3 - 2x^2 + 3x + C$.'
    answer: '$2x^3 - 2x^2 + 3x + C$'
  - uid: g12-mathematics-2-4-se02
    problem: 'Evaluate $\int_1^2 (3x^2 + 1)\,dx$.'
    steps:
      - 'An antiderivative is $F(x) = x^3 + x$.'
      - '$F(2) - F(1) = (8 + 2) - (1 + 1) = 10 - 2$.'
      - 'The value is 8.'
    answer: '8'
  - uid: g12-mathematics-2-4-se03
    problem: 'Find the area enclosed by $y = x^2$ and $y = 2x$.'
    steps:
      - 'Intersections: $x^2 = 2x$ gives $x = 0$ and $x = 2$. Between them $2x \ge x^2$.'
      - '$A = \int_0^2 (2x - x^2)\,dx = \left[x^2 - \frac{x^3}{3}\right]_0^2$.'
      - '$= 4 - \frac{8}{3} = \frac{4}{3}$.'
    answer: '$\frac{4}{3}$ square units'

flashcards:
  - {uid: g12-mathematics-2-4-fc01, term: Antiderivative, definition: 'A function $F$ with $F''(x) = f(x)$.'}
  - {uid: g12-mathematics-2-4-fc02, term: Indefinite integral, definition: '$\int f(x)\,dx = F(x) + C$: the family of all antiderivatives.'}
  - {uid: g12-mathematics-2-4-fc03, term: Constant of integration, definition: 'The $C$ added because constants vanish when differentiating.'}
  - {uid: g12-mathematics-2-4-fc04, term: Definite integral, definition: '$\int_a^b f(x)\,dx$, a number; the signed area under the curve from $a$ to $b$.'}
  - {uid: g12-mathematics-2-4-fc05, term: Fundamental theorem of calculus, definition: '$\int_a^b f(x)\,dx = F(b) - F(a)$ where $F'' = f$.'}
  - {uid: g12-mathematics-2-4-fc06, term: Limits of integration, definition: 'The numbers $a$ (lower) and $b$ (upper) in $\int_a^b$.'}
  - {uid: g12-mathematics-2-4-fc07, term: Integral of velocity, definition: 'Gives the displacement over the time interval.'}
  - {uid: g12-mathematics-2-4-fc08, term: Same limits, definition: '$\int_a^a f(x)\,dx = 0$'}
  - {uid: g12-mathematics-2-4-fc09, term: Area between curves, definition: '$\int_a^b (\text{top} - \text{bottom})\,dx$'}

questions:
  - uid: g12-mathematics-2-4-q001
    type: single_choice
    difficulty: 1
    stem: 'What is $\int x^2\,dx$?'
    options:
      A: '$2x + C$'
      B: '$\frac{x^3}{3} + C$'
      C: '$x^3 + C$'
      D: '$\frac{x^2}{2} + C$'
    answer: B
    explanation: 'Power rule: $\int x^2\,dx = \frac{x^{2+1}}{2+1} + C = \frac{x^3}{3} + C$. Check: the derivative of $\frac{x^3}{3}$ is $x^2$.'

  - uid: g12-mathematics-2-4-q002
    type: single_choice
    difficulty: 1
    stem: 'What is $\int (4x^3 - 2x)\,dx$?'
    options:
      A: '$x^4 - x^2 + C$'
      B: '$12x^2 - 2 + C$'
      C: '$4x^4 - 2x^2 + C$'
      D: '$x^4 - 2x^2 + C$'
    answer: A
    explanation: '$4 \cdot \frac{x^4}{4} - 2 \cdot \frac{x^2}{2} + C = x^4 - x^2 + C$.'

  - uid: g12-mathematics-2-4-q003
    type: numeric
    difficulty: 1
    stem: 'Evaluate $\int_0^2 3x^2\,dx$.'
    answer: {value: 8, tolerance: 0}
    explanation: 'An antiderivative is $x^3$, so the value is $2^3 - 0^3 = 8$.'

  - uid: g12-mathematics-2-4-q004
    type: single_choice
    difficulty: 2
    stem: 'What is $\int_1^3 (2x + 1)\,dx$?'
    options:
      A: '8'
      B: '12'
      C: '10'
      D: '6'
    answer: C
    explanation: 'An antiderivative is $x^2 + x$. $F(3) - F(1) = (9 + 3) - (1 + 1) = 10$.'

  - uid: g12-mathematics-2-4-q005
    type: single_choice
    difficulty: 1
    stem: 'What is $\int 5\,dx$?'
    options:
      A: '$0$'
      B: '$5 + C$'
      C: '$\frac{5x^2}{2} + C$'
      D: '$5x + C$'
    answer: D
    explanation: 'The derivative of $5x$ is 5, so $\int 5\,dx = 5x + C$.'

  - uid: g12-mathematics-2-4-q006
    type: true_false
    difficulty: 1
    stem: 'For a differentiable function $f$, $\int f''(x)\,dx = f(x) + C$.'
    answer: true
    explanation: '$f$ is an antiderivative of $f''$, so the indefinite integral of $f''$ is $f(x) + C$.'

  - uid: g12-mathematics-2-4-q007
    type: single_choice
    difficulty: 2
    stem: 'A function $F$ has $F''(x) = 6x$ and $F(1) = 5$. What is $F(x)$?'
    options:
      A: '$3x^2 + 2$'
      B: '$3x^2 + 5$'
      C: '$6x^2 - 1$'
      D: '$3x^2 - 2$'
    answer: A
    explanation: '$F(x) = 3x^2 + C$. From $F(1) = 3 + C = 5$ we get $C = 2$.'

  - uid: g12-mathematics-2-4-q008
    type: numeric
    difficulty: 1
    stem: 'What is the area between the line $y = x$ and the $x$-axis from $x = 0$ to $x = 4$?'
    answer: {value: 8, tolerance: 0}
    explanation: '$\int_0^4 x\,dx = \frac{4^2}{2} = 8$. It is also a triangle with base 4 and height 4: $\frac{1}{2} \times 4 \times 4 = 8$.'

  - uid: g12-mathematics-2-4-q009
    type: single_choice
    difficulty: 2
    stem: 'What is $\int x^{-2}\,dx$ (for $x \neq 0$)?'
    options:
      A: '$-2x^{-3} + C$'
      B: '$-\frac{1}{x} + C$'
      C: '$\frac{1}{x} + C$'
      D: '$-\frac{x^{-3}}{3} + C$'
    answer: B
    explanation: '$\frac{x^{-1}}{-1} + C = -\frac{1}{x} + C$. Check: the derivative of $-x^{-1}$ is $x^{-2}$.'

  - uid: g12-mathematics-2-4-q010
    type: single_choice
    difficulty: 2
    stem: 'What is $\int \sqrt{x}\,dx$ (for $x \ge 0$)?'
    options:
      A: '$\frac{1}{2\sqrt{x}} + C$'
      B: '$\frac{3}{2}x^{3/2} + C$'
      C: '$\frac{2}{3}x^{3/2} + C$'
      D: '$x^{3/2} + C$'
    answer: C
    explanation: '$\int x^{1/2}\,dx = \frac{x^{3/2}}{3/2} + C = \frac{2}{3}x^{3/2} + C$.'

  - uid: g12-mathematics-2-4-q011
    type: single_choice
    difficulty: 2
    stem: 'What is $\int_0^1 (x^2 + 1)\,dx$?'
    options:
      A: '1'
      B: '2'
      C: '$\frac{1}{3}$'
      D: '$\frac{4}{3}$'
    answer: D
    explanation: 'An antiderivative is $\frac{x^3}{3} + x$. At 1 it is $\frac{1}{3} + 1 = \frac{4}{3}$; at 0 it is 0.'

  - uid: g12-mathematics-2-4-q012
    type: true_false
    difficulty: 1
    stem: 'For any function $f$ defined at $a$, $\int_a^a f(x)\,dx = 0$.'
    answer: true
    explanation: 'The interval has no width, so $F(a) - F(a) = 0$.'

  - uid: g12-mathematics-2-4-q013
    type: single_choice
    difficulty: 2
    stem: 'Which statement is always true?'
    options:
      A: '$\int_b^a f(x)\,dx = -\int_a^b f(x)\,dx$'
      B: '$\int_b^a f(x)\,dx = \int_a^b f(x)\,dx$'
      C: '$\int_a^b f(x)g(x)\,dx = \int_a^b f(x)\,dx \cdot \int_a^b g(x)\,dx$'
      D: '$\int_a^b f(x)\,dx \ge 0$'
    answer: A
    explanation: 'Swapping the limits changes $F(b) - F(a)$ into $F(a) - F(b)$, which is the negative. C fails in general, and D fails when $f$ is negative.'

  - uid: g12-mathematics-2-4-q014
    type: single_choice
    difficulty: 2
    stem: 'What is the area between $y = x^2$ and the $x$-axis from $x = 0$ to $x = 3$?'
    options:
      A: '27'
      B: '9'
      C: '3'
      D: '6'
    answer: B
    explanation: '$\int_0^3 x^2\,dx = \frac{3^3}{3} = 9$ square units.'

  - uid: g12-mathematics-2-4-q015
    type: numeric
    difficulty: 2
    stem: 'Evaluate $\int_{-1}^{1} x^3\,dx$.'
    answer: {value: 0, tolerance: 0}
    explanation: 'An antiderivative is $\frac{x^4}{4}$. $\frac{1}{4} - \frac{1}{4} = 0$. The negative area on the left cancels the positive area on the right.'

  - uid: g12-mathematics-2-4-q016
    type: multiple_answers
    difficulty: 2
    stem: 'Which functions are antiderivatives of $3x^2$? Choose all that apply.'
    options:
      A: '$x^3$'
      B: '$x^3 + 4$'
      C: '$6x$'
      D: '$x^3 - \frac{1}{2}$'
    answer: [A, B, D]
    explanation: 'Each of $x^3$, $x^3 + 4$ and $x^3 - \frac{1}{2}$ has derivative $3x^2$. $6x$ is the derivative of $3x^2$, not an antiderivative.'

  - uid: g12-mathematics-2-4-q017
    type: numeric
    difficulty: 2
    stem: 'A body moves with velocity $v(t) = 2t + 1$ m/s. How far, in metres, does it move from $t = 0$ to $t = 3$ s?'
    answer: {value: 12, tolerance: 0, unit: m}
    explanation: 'Displacement $= \int_0^3 (2t + 1)\,dt = [t^2 + t]_0^3 = 9 + 3 = 12$ m. The velocity is always positive, so this is also the distance.'

  - uid: g12-mathematics-2-4-q018
    type: single_choice
    difficulty: 3
    stem: 'What is the area enclosed between $y = x$ and $y = x^2$?'
    options:
      A: '$\frac{1}{2}$'
      B: '$\frac{1}{3}$'
      C: '$\frac{1}{6}$'
      D: '$\frac{5}{6}$'
    answer: C
    explanation: 'They meet at $x = 0$ and $x = 1$, and $x \ge x^2$ between them. $\int_0^1 (x - x^2)\,dx = \frac{1}{2} - \frac{1}{3} = \frac{1}{6}$.'

  - uid: g12-mathematics-2-4-q019
    type: single_choice
    difficulty: 3
    stem: 'Which of these is $\int (x + 1)^2\,dx$?'
    options:
      A: '$2(x + 1) + C$'
      B: '$\frac{x^3}{3} + 1 + C$'
      C: '$(x + 1)^3 + C$'
      D: '$\frac{(x + 1)^3}{3} + C$'
    answer: D
    explanation: 'The derivative of $\frac{(x + 1)^3}{3}$ is $(x + 1)^2$. (Expanding gives $\frac{x^3}{3} + x^2 + x + C$, which differs only by a constant.)'

  - uid: g12-mathematics-2-4-q020
    type: fill_in
    difficulty: 1
    stem: 'An integral written without limits, such as $\int f(x)\,dx$, is called an ________ integral.'
    answer: [indefinite]
    explanation: 'Without limits it is the indefinite integral, a family of functions $F(x) + C$. With limits it is a definite integral, a number.'

  - uid: g12-mathematics-2-4-q021
    type: single_choice
    difficulty: 3
    stem: 'What is $\int_2^4 \frac{1}{x^2}\,dx$?'
    options:
      A: '$\frac{1}{4}$'
      B: '$\frac{1}{2}$'
      C: '$\frac{3}{16}$'
      D: '$-\frac{1}{4}$'
    answer: A
    explanation: 'An antiderivative is $-\frac{1}{x}$. $\left(-\frac{1}{4}\right) - \left(-\frac{1}{2}\right) = \frac{1}{4}$.'

  - uid: g12-mathematics-2-4-q022
    type: matching
    difficulty: 1
    stem: 'Match each integral with its result ($k$ and $n$ are constants, $n \neq -1$).'
    left:
      L1: '$\int x^n\,dx$'
      L2: '$\int k\,dx$'
      L3: '$\int (f + g)\,dx$'
    right:
      R1: '$kx + C$'
      R2: '$\int f\,dx + \int g\,dx$'
      R3: '$\frac{x^{n+1}}{n + 1} + C$'
      R4: '$\int f\,dx \cdot \int g\,dx$'
    answer: {L1: R3, L2: R1, L3: R2}
    explanation: 'Power rule, constant rule and sum rule. A product of integrals is not the integral of anything listed here.'

  - uid: g12-mathematics-2-4-q023
    type: ordering
    difficulty: 3
    stem: 'Put these integrals in order of their values, from smallest to largest.'
    items:
      A: '$\int_0^1 x\,dx$'
      B: '$\int_0^1 x^2\,dx$'
      C: '$\int_0^2 x\,dx$'
      D: '$\int_0^1 1\,dx$'
    answer: [B, A, D, C]
    explanation: 'A $= \frac{1}{2}$, B $= \frac{1}{3}$, C $= 2$, D $= 1$. In order: $\frac{1}{3}, \frac{1}{2}, 1, 2$.'

  - uid: g12-mathematics-2-4-q024
    type: single_choice
    difficulty: 2
    stem: 'If $\int_0^3 f(x)\,dx = 7$ and $\int_3^5 f(x)\,dx = 4$, what is $\int_0^5 f(x)\,dx$?'
    options:
      A: '3'
      B: '11'
      C: '28'
      D: '$-3$'
    answer: B
    explanation: 'Adjacent intervals add: $\int_0^5 f = \int_0^3 f + \int_3^5 f = 7 + 4 = 11$.'

  - uid: g12-mathematics-2-4-q025
    type: single_choice
    difficulty: 2
    stem: 'What is $\int_0^2 (3x^2 - 2x)\,dx$?'
    options:
      A: '8'
      B: '12'
      C: '4'
      D: '0'
    answer: C
    explanation: 'An antiderivative is $x^3 - x^2$. At 2: $8 - 4 = 4$; at 0: 0. The value is 4.'

  - uid: g12-mathematics-2-4-q026
    type: true_false
    difficulty: 2
    stem: 'If $f$ is continuous on $[a, b]$ with $a < b$ and $f(x) < 0$ for every $x$ in $[a, b]$, then $\int_a^b f(x)\,dx < 0$.'
    answer: true
    explanation: 'The region lies below the $x$-axis, so it counts as negative signed area.'

  - uid: g12-mathematics-2-4-q027
    type: single_choice
    difficulty: 3
    stem: 'What is the area between the curve $y = 4 - x^2$ and the $x$-axis?'
    options:
      A: '$\frac{16}{3}$'
      B: '16'
      C: '8'
      D: '$\frac{32}{3}$'
    answer: D
    explanation: 'The curve meets the axis at $x = \pm 2$. $\int_{-2}^{2} (4 - x^2)\,dx = \left[4x - \frac{x^3}{3}\right]_{-2}^{2} = \left(8 - \frac{8}{3}\right) - \left(-8 + \frac{8}{3}\right) = \frac{32}{3}$.'

  - uid: g12-mathematics-2-4-q028
    type: single_choice
    difficulty: 2
    stem: 'According to the fundamental theorem of calculus, if $F''(x) = f(x)$, then $\int_a^b f(x)\,dx$ equals:'
    options:
      A: '$F(b) - F(a)$'
      B: '$F(a) - F(b)$'
      C: '$f(b) - f(a)$'
      D: '$F(b) + F(a)$'
    answer: A
    explanation: 'Evaluate an antiderivative at the upper limit and subtract its value at the lower limit.'

  - uid: g12-mathematics-2-4-q029
    type: single_choice
    difficulty: 3
    stem: 'A factory''s marginal cost is $C''(x) = 10 + 2x$ birr per item. By how much does the total cost rise when production goes from 0 to 5 items?'
    options:
      A: '20 birr'
      B: '75 birr'
      C: '50 birr'
      D: '100 birr'
    answer: B
    explanation: '$\int_0^5 (10 + 2x)\,dx = [10x + x^2]_0^5 = 50 + 25 = 75$ birr.'

  - uid: g12-mathematics-2-4-q030
    type: single_choice
    difficulty: 1
    stem: 'What is $\int (6x^2 + 4)\,dx$?'
    options:
      A: '$12x + C$'
      B: '$6x^3 + 4x + C$'
      C: '$2x^3 + 4x + C$'
      D: '$2x^3 + 4 + C$'
    answer: C
    explanation: '$6 \cdot \frac{x^3}{3} + 4x + C = 2x^3 + 4x + C$.'
