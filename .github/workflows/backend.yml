name: Backend

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main, develop]
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.2 = minimum for shared hosting, 8.3 = recommended.
        php: ['8.2', '8.3']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Nova credentials (only when the secrets exist)
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: |
          if [ -n "$NOVA_USERNAME" ] && [ -n "$NOVA_LICENSE_KEY" ]; then
            composer config --global http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"
            echo "Nova credentials configured."
          else
            echo "No Nova secrets: running without Nova."
          fi

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}

      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate composer files
        run: composer validate --strict --no-check-publish

      - name: Security audit
        run: composer audit

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Larastan (level 8)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test

      - name: Migrations run on a fresh database
        run: |
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --force
          php artisan migrate:rollback --force
