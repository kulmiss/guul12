name: App

on:
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  push:
    branches: [main, develop]
    paths: ['app/**', '.github/workflows/app.yml']

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: golden pictures are compared pixel by pixel, so every run uses the same Flutter.
  FLUTTER_VERSION: '3.50.1'

jobs:
  check:
    name: Analyze, test, goldens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Translations are generated and committed
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze (infos count as errors)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Tests (unit, widget, golden)
        run: flutter test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/golden/failures/
          if-no-files-found: ignore

      - name: Dependency audit (OSV)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile pubspec.lock

  build:
    name: Release build
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21: the Android lint in the current build tools crashes on Java 17 while checking
          # plugin code (webview_flutter_android). The release build is verified on Java 21.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Signed with the debug key in CI (the upload key never leaves the owner's computer).
      - name: Build APKs and app bundle
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Release checks (version, target SDK, exact permissions, adaptive icon)
        run: |
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            python3 tool/check_apk.py "$apk"
          done

      - name: Sizes
        run: |
          ls -l build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab \
            | awk '{printf "%-70s %6.1f MB\n", $9, $5/1048576}' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: guul12-apk-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
