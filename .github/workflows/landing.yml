name: Landing

on:
  pull_request:
    paths:
      - 'backend/resources/views/landing/**'
      - 'backend/lang/**'
      - 'backend/app/Http/Controllers/LandingController.php'
      - 'backend/app/Services/LandingStats.php'
      - 'backend/app/Services/Branding/**'
      - 'backend/app/Support/**'
      - 'backend/app/Models/LandingReview.php'
      - 'backend/database/**'
      - 'content/**'
      - 'backend/routes/web.php'
      - 'backend/public/**'
      - 'tools/lighthouse/**'
      - '.github/workflows/landing.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/resources/views/landing/**'
      - 'backend/lang/**'
      - 'backend/app/Http/Controllers/LandingController.php'
      - 'backend/app/Services/LandingStats.php'
      - 'backend/app/Services/Branding/**'
      - 'backend/app/Support/**'
      - 'backend/app/Models/LandingReview.php'
      - 'backend/database/**'
      - 'content/**'
      - 'backend/routes/web.php'
      - 'backend/public/**'
      - 'tools/lighthouse/**'
      - '.github/workflows/landing.yml'

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (every page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Install backend
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force
          # The real content, so the pages are checked with every section shown (numbers, subjects).
          php artisan db:seed --force
          php artisan content:import ../content
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Start the site
        working-directory: backend
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > ../serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/ && exit 0; sleep 1; done
          cat ../serve.log && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/lighthouse/package-lock.json

      - name: Install Lighthouse
        working-directory: tools/lighthouse
        run: |
          npm ci --no-fund
          npm audit --audit-level=low

      - name: Scores (performance 95+, accessibility / best practices / SEO 100)
        working-directory: tools/lighthouse
        run: npm run check
