name: guul12
description: "Guul 12 - Ethiopian Grade 9-12 national exam prep"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0

  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  sqflite: ^2.4.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.4.7
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/hook/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
